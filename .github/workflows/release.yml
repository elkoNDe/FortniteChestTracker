name: Publish Windows EXE release

# v0.4.2: shorter Golden Ticket panel copy; no changes to probability calculations.
# Future releases are explicitly started via "Run workflow" after bumping
# <Version> in the project file; normal code pushes never publish a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: fortnite-chesttracker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'elkoNDe/FortniteChestTracker' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw 'src/FortniteChestTracker/FortniteChestTracker.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid project version: $version"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Run application self-tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test time ranges and dashboard filters
        shell: pwsh
        run: node --test scripts/dashboard.test.cjs

      - name: Build standalone Windows EXE
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test isolated EXE, browser, SQLite and watcher
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = 'dist/win-x64/FortniteChestTracker.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Standalone executable not found.'
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FortniteChestTracker.exe" | Set-Content -LiteralPath 'dist/win-x64/SHA256SUMS.txt' -Encoding utf8

      - name: Publish EXE directly to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump the project version before publishing another."
          }
          @'
          Fortnite ChestTracker para Windows 10/11 x64.

          **Descarga FortniteChestTracker.exe directamente**, sin ZIP y sin instalar .NET.
          El archivo SHA256SUMS.txt permite verificar su integridad.

          - Contador local de cofres a partir de repeticiones Fortnite.
          - Estadísticas personales, equipo, historial y panel HTML.
          - Diez estilos visuales seleccionables: Arena, Tactical HUD, Studio Light, Prism,
            Carbon, Neon Arcade, Glacier, Solar Flare, Ember y Blueprint.
          - NUEVO: tarjeta de Pirate Shop Access con probabilidad acumulada teórica
            desde el 1 de noviembre de 2026; cuenta también los cofres destruidos.
          - Tasa oficial base 1 entre 137.500; Horas del Tesoro por segundo de apertura.
          - Se aplica x1,5 el 7 nov 19-21 UTC y x2 el 8 nov 02-04 UTC (confirmados).
          - Los siguientes sábados se muestran explícitamente como previsiones x1,5;
            estos horarios pueden cambiar si Epic anuncia novedades.
          - Probabilidad secundaria de Party; nueva etiqueta «Próxima Treasure Hour»
            y próximas sesiones indicadas simplemente como «prevista».
          - Cada cofre es independiente: nunca se garantiza conseguir el ticket.
          - Se mantienen el icono de bandeja sin consola, el estado del monitor, los
            diez estilos y todos los filtros/historiales. Los datos son locales.
          - Solo Battle Royale Cero construcción (Solo/Duo/Trio/Squad).
          - Los datos se conservan en tu propio ordenador.

          Activa la grabación de repeticiones desde Fortnite y ejecuta el EXE.
          El ejecutable no está firmado digitalmente: comprueba cualquier alerta de Windows
          y no desactives las medidas de seguridad para ejecutarlo.

          Nota: el parser y la atribución de compañeros aún requieren validación
          con más repeticiones reales de diferentes versiones de Fortnite.
          Proyecto independiente, no afiliado a Epic Games.
          '@ | Set-Content -LiteralPath RELEASE_NOTES.md -Encoding utf8
          gh release create $tag 'dist/win-x64/FortniteChestTracker.exe' 'dist/win-x64/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title "Fortnite ChestTracker $tag" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
